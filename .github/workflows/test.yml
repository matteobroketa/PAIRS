name: Test and lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install pytest ruff
      - run: python -m pytest -q
      - run: python -m ruff check pipeline tests
      - run: npx --yes prettier@3.9.6 --check index.html assets config
      - run: node --check assets/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
