name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Derive weekly snapshot cache key
        run: echo "DATA_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - name: Restore validated snapshot cache
        id: snapshot-cache
        uses: actions/cache@v5
        with:
          path: |
            data/v4
            .cache/sources
          key: pairs-v4-${{ runner.os }}-${{ hashFiles('pipeline/**', 'config/**') }}-${{ env.DATA_WEEK }}
      - name: Build current public data snapshot
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: python -m pipeline.build --output data/v4
      - name: Validate generated data
        run: python -m pipeline.validate data/v4
      - name: Benchmark similarity candidate recall
        run: python -m pipeline.benchmark data/v4 --samples 100 --output data/v4/similarity-benchmark.json
      - name: Release compatibility gate
        run: |
          python - <<'PY'
          import json
          manifest = json.load(open("data/v4/manifest.json", encoding="utf-8"))
          clusters = json.load(open("data/v4/clusters/index.json", encoding="utf-8"))
          assert manifest["schema_version"] == 4
          assert manifest["sources_ok"] == manifest["sources_expected"]
          support = manifest["sources"]["iedb"]["support"]
          assert support["linked_assay_ids"] > 0
          assert support["bcell_export_rows"] > 0
          assert clusters["thresholds"] == [99, 95, 90]
          assert set(clusters["scopes"]) == {"heavy", "light", "paired"}
          PY
      - name: Target review summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          candidates = json.load(open("data/v4/target-review.json", encoding="utf-8"))["candidates"]
          print("## Target review candidates\n")
          print(f"Unresolved candidates: {len(candidates)}\n")
          for item in candidates[:10]:
              print(f"- {item['name_a']} ↔ {item['name_b']} (Jaccard: {item['jaccard']})")
          PY
      - name: Assemble static artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets docs _site/
          cp -r data/v4 _site/data/v4
          touch _site/.nojekyll
      - name: Artifact footprint gate
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          files = [path for path in Path("_site").rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in files)
          largest = max(files, key=lambda path: path.stat().st_size)
          print("## Static artifact footprint\n")
          print(f"- Files: {len(files):,}")
          print(f"- Uncompressed bytes: {total:,}")
          print(f"- Largest file: {largest} ({largest.stat().st_size:,} bytes)")
          assert len(files) < 30_000
          assert total < 4_000_000_000
          assert largest.stat().st_size < 100_000_000
          PY
      - name: Static HTTP smoke test
        run: |
          python -m http.server 8000 --directory _site >/tmp/pairs-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for path in index.html data/v4/manifest.json data/v4/clusters/index.json; do
            curl --fail --retry 5 --retry-connrefused "http://127.0.0.1:8000/$path" >/dev/null
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
