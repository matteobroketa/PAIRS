name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - "robots.txt"
      - "sitemap.xml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build production data"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find and download validated production data
        id: production-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_DATA_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="$EVENT_DATA_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow build-data.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          fi
          test -n "$run_id"
          gh run download "$run_id" --name pairs-production-v4 --dir production-data
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Verify downloaded production snapshot
        run: |
          python - <<'PY'
          import json

          manifest = json.load(open("production-data/v4/manifest.json", encoding="utf-8"))
          clusters = json.load(open("production-data/v4/clusters/index.json", encoding="utf-8"))
          assert manifest["schema_version"] == 4
          assert manifest["data_contract_revision"] == 8
          assert manifest["antibody_count"] > 10_000, "refusing capped starter data"
          assert manifest["sources_ok"] == manifest["sources_expected"]
          support = manifest["sources"]["iedb"]["support"]
          assert support["linked_assay_ids"] > 0
          assert support["bcell_export_rows"] > 0
          assert clusters["thresholds"] == [99, 95, 90]
          assert set(clusters["scopes"]) == {"heavy", "light", "paired"}
          print(f"Deploying {manifest['antibody_count']:,} antibodies from snapshot {manifest['snapshot']}")
          PY
      - name: Assemble static artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets docs config _site/
          cp -r production-data/v4 _site/data/v4
          touch _site/.nojekyll
      - name: Artifact footprint gate
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path

          files = [path for path in Path("_site").rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in files)
          largest = max(files, key=lambda path: path.stat().st_size)
          print("## Static artifact footprint\n")
          print(f"- Files: {len(files):,}")
          print(f"- Uncompressed bytes: {total:,}")
          print(f"- Largest file: {largest} ({largest.stat().st_size:,} bytes)")
          assert len(files) < 30_000
          assert total < 4_000_000_000
          assert largest.stat().st_size < 100_000_000
          PY
      - name: Static HTTP smoke test
        run: |
          python -m http.server 8000 --directory _site >/tmp/pairs-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for path in index.html config/sequence_contract.json config/search_examples.json data/v4/manifest.json data/v4/clusters/index.json; do
            curl --fail --retry 5 --retry-connrefused "http://127.0.0.1:8000/$path" >/dev/null
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
