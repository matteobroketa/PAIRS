name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build current public data snapshot
        run: python -m pipeline.build --output data/v4
      - name: Validate generated data
        run: python -m pipeline.validate data/v4
      - name: Target review summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          candidates = json.load(open("data/v4/target-review.json", encoding="utf-8"))["candidates"]
          print("## Target review candidates\n")
          print(f"Unresolved candidates: {len(candidates)}\n")
          for item in candidates[:10]:
              print(f"- {item['name_a']} ↔ {item['name_b']} (Jaccard: {item['jaccard']})")
          PY
      - name: Assemble static artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data docs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
