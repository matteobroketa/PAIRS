name: Validate data pipeline

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The similarity/cluster rebuild scans the full compact snapshot.  It is
    # intentionally production-sized and can exceed the default 30-minute
    # window on GitHub-hosted runners.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build similarity fixture
        run: python -m pipeline.build --output data/v4 --similarity-only
      - name: Validate fixture
        run: python -m pipeline.validate data/v4
      - name: Benchmark similarity candidate recall
        run: python -m pipeline.benchmark data/v4 --samples 20 --output similarity-benchmark.json
