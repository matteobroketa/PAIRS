[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-antibody-search"
version = "4.0.0"
description = "PAIRS: static, provenance-aware metasearch for public antibody data"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pairs = "pipeline.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
